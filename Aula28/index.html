<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 28</title>
    <style>
        label {
            display: block;
        }

        </style>
</head>
<body>
    <h1>Formulario de preenchimento</h1>
    <form id="formularioContato">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required maxlength="256">
        <label for="email">Email:</label>
        <input type="email" id="email" required maxlength="356">
        <label for="mensagem">Mensagem:</label>
        <textarea required id="mensagem"></textarea>
        <button type="submit">Enviar</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
